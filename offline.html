<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7a01d" />
    <title>Watersun CRM - Offline</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #F9FAFB; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #1f2937; text-align: center; }
        main { padding: 24px; max-width: 360px; }
        img { width: 220px; max-width: 70%; height: auto; margin-bottom: 24px; }
        h1 { font-size: 22px; margin: 0 0 8px; }
        p { margin: 0 0 24px; color: #4b5563; line-height: 1.5; }
        button { background: #f7a01d; color: #fff; border: 0; border-radius: 8px; padding: 12px 28px; font-size: 16px; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <img src="Watersun%20Blue%20Logo%20PNG.png" alt="Watersun" />
        <h1>You are offline</h1>
        <p>Sorry, please connect to the internet to view the Watersun CRM.</p>
        <button onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
