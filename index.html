<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="robots" content="noindex" />
  <title>Scheduled Update — Watersun CRM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px; background: #fafaf9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      width: 100%; max-width: 440px; padding: 48px 32px; text-align: center;
      background: white; border: 1px solid #f5f5f4; border-radius: 28px;
      box-shadow: 0 10px 40px rgba(28, 25, 23, 0.08);
    }
    .sun { width: 52px; height: 52px; margin: 0 auto 20px; color: #f59e0b; }
    h1 { margin: 0 0 8px; color: #1c1917; font-size: 23px; font-weight: 900; }
    .brand { margin: 0 0 26px; color: #a8a29e; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .message { margin: 0; color: #57534e; font-size: 14px; font-weight: 500; line-height: 1.65; }
    .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 28px; padding: 10px 14px; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 14px; font-size: 12px; font-weight: 800; }
    .dot { width: 8px; height: 8px; border-radius: 999px; background: #f59e0b; }
  </style>
</head>
<body>
  <main class="card">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M17.66 6.34l1.41-1.41"></path>
    </svg>
    <h1>Scheduled CRM Update</h1>
    <p class="brand">Watersun Solar Energy</p>
    <p class="message">The CRM is temporarily unavailable while an update is being completed. Please try again shortly.</p>
    <div class="status"><span class="dot"></span> Maintenance in progress</div>
  </main>
</body>
</html>
